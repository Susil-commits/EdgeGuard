all:
  hosts:
    # Populated dynamically by ansible-runner using the node_id from the event payload.
    # In a real deployment: use a dynamic inventory plugin (e.g., Ansible Tower/AWX, or a custom script
    # that queries the EdgeGuard /v1/nodes API).
    # For local demo: add the Oracle VM IP below.
    edge_node_01:
      ansible_host: "{{ target_node }}"  # set via extra_vars from rulebook
      ansible_user: edgeguard
      ansible_ssh_private_key_file: ~/.ssh/edgeguard_key
      ansible_become: true
      ansible_become_method: sudo
