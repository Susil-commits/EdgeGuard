apiVersion: apps/v1
kind: Deployment
metadata:
  name: edgeguard-worker
  namespace: edgeguard
  labels:
    app: edgeguard-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edgeguard-worker
  template:
    metadata:
      labels:
        app: edgeguard-worker
    spec:
      containers:
        - name: worker
          image: ghcr.io/edgeguard/api:latest
          imagePullPolicy: IfNotPresent
          command: ["rq", "worker", "--url", "redis://redis:6379/0", "edgeguard"]
          envFrom:
            - configMapRef:
                name: edgeguard-config
            - secretRef:
                name: edgeguard-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
