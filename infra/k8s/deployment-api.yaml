apiVersion: apps/v1
kind: Deployment
metadata:
  name: edgeguard-api
  namespace: edgeguard
  labels:
    app: edgeguard-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: edgeguard-api
  template:
    metadata:
      labels:
        app: edgeguard-api
    spec:
      containers:
        - name: api
          image: ghcr.io/edgeguard/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: edgeguard-config
            - secretRef:
                name: edgeguard-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 5
