apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: edgeguard-default-deny
  namespace: edgeguard
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-allow-ingress
  namespace: edgeguard
spec:
  podSelector:
    matchLabels:
      app: edgeguard-api
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8000
